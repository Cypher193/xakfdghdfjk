# Pilot configuration. Values marked VERIFY are checked in the day-1 smoke test.

paths:
  data: data
  runs: runs
  results: results

# Input window per model (cond_frames). Cosmos-Predict2.5 accepts at most 2 latent frames = 5 pixel frames
# (0.3125 s at 16 fps). Wan-VACE and LTX get ~1 s, ending on a latent-frame boundary (VACE 17 = 1 + 4*4,
# LTX 25 = 1 + 8*3). The main result (probe vs output) compares each model with itself on identical input,
# so the windows need not match across models; cross-model comparisons note the difference.
score_until_s: 5.0          # score from the end of the input window to this time

seeds: [0, 1, 2]
capture_fractions: [0.25, 0.5, 0.75]   # denoising progress at which activations are saved

models:
  cosmos2b:
    repo: nvidia/Cosmos-Predict2.5-2B
    revision: diffusers/base/post-trained
    pipeline: Cosmos2_5_PredictBasePipeline
    input: cosmos25
    fps: 16
    num_frames: 93
    height: 480               # 480p chosen after the smoke test: same behaviour as 720p, 3.5x faster
    width: 832                # (720p: 965 s/clip on L40S; 480p: 272 s)
    vae_tiling: true
    cpu_offload: true         # needed: with .to("cuda") diffusers 0.41 + cosmos_guardrail raises '_execution_device' missing
    steps: 36
    guidance: 7.0
    cond_frames: 5
    blocks: [transformer_blocks]
    patch: [1, 2, 2]
    vae_stride: [4, 8, 8]
    cfg: separate             # cond pass first, then uncond pass
  ltx2b:
    repo: Lightricks/LTX-Video-0.9.5
    pipeline: LTXConditionPipeline
    input: ltx_conditions
    fps: 24
    num_frames: 121
    height: 480
    width: 832               # 832x480 keeps the 16:9 render aspect (704 squashed it 15%)
    steps: 50
    guidance: 3.0
    cond_frames: 25           # 8k+1 frames; 1.04 s at 24 fps
    blocks: [transformer_blocks]
    patch: [1, 1, 1]
    vae_stride: [8, 32, 32]
    cfg: batched              # batch = [uncond, cond]
    cond_batch_index: 1
  vace13:
    repo: Wan-AI/Wan2.1-VACE-1.3B-diffusers
    pipeline: WanVACEPipeline
    input: vace_mask
    fps: 16
    num_frames: 81
    height: 480
    width: 832
    steps: 50
    guidance: 5.0
    cond_frames: 17           # 1.06 s at 16 fps; known/masked boundary on a latent frame
    blocks: [blocks, vace_blocks]   # probes use `blocks`; `vace_blocks` kept for later
    patch: [1, 2, 2]
    vae_stride: [4, 8, 8]
    cfg: separate
  wan22_5b:                   # C1-inv / C1-noise only (never generates in this study)
    repo: Wan-AI/Wan2.2-TI2V-5B-Diffusers
    vae_tiling: true
    cpu_offload: true
    pipeline: WanPipeline
    fps: 24
    num_frames: 121
    height: 480               # pilot budget: P7 only needs a forward pass at 480p
    width: 832
    steps: 50
    blocks: [blocks]
    patch: [1, 2, 2]
    vae_stride: [4, 16, 16]
  cosmos14b:                  # timing only (P11): one clip, same settings as cosmos2b
    repo: nvidia/Cosmos-Predict2.5-14B
    revision: diffusers/base/post-trained
    pipeline: Cosmos2_5_PredictBasePipeline
    input: cosmos25
    fps: 16
    num_frames: 93
    height: 480
    width: 832
    vae_tiling: true
    cpu_offload: true          # same diffusers issue as cosmos2b
    steps: 36
    guidance: 7.0
    cond_frames: 5
    blocks: [transformer_blocks]
    patch: [1, 2, 2]
    vae_stride: [4, 8, 8]
    cfg: separate
  cosmos3_nano:               # timing only (P11): scripts/time_nano.py in its own venv (needs diffusers main)
    repo: nvidia/Cosmos3-Nano
    note: Cosmos3OmniDiffusersPipeline is not in diffusers 0.41; follow the model card

# Rendered scenes (pinhole camera facing the motion plane y = 0)
render:
  width: 854
  height: 480
  fps: 24
  duration_s: 6.0
  camera_distance_m: 5.0
  hfov_deg: 50.0
  floor_z_m: -1.0
  samples: 32

experiments:
  b1:      {scenes: kmain, text: caption}
  b2nl:    {scenes: kmain, text: b2nl, video: false}
  b5:      {scenes: kgrav, text: caption}
  bratio:  {scenes: kratio, text: caption}
  b1real:  {scenes: real, text: caption, seeds: [0, 1]}
