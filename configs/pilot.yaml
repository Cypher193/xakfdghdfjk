# Pilot configuration. Values marked VERIFY are checked in the day-1 smoke test.

paths:
  data: data
  runs: runs
  results: results

# Input window per model (cond_frames). Cosmos-Predict2.5 accepts at most 2 latent frames = 5 pixel frames
# (0.3125 s at 16 fps). Wan-VACE and LTX get ~1 s, ending on a latent-frame boundary (VACE 17 = 1 + 4*4,
# LTX 25 = 1 + 8*3). The main result (probe vs output) compares each model with itself on identical input,
# so the windows need not match across models; cross-model comparisons note the difference.
score_until_s: 5.0          # score from the end of the input window to this time

seeds: [0, 1, 2]
capture_fractions: [0.25, 0.5, 0.75]   # denoising progress at which activations are saved

models:
  cosmos2b:
    repo: nvidia/Cosmos-Predict2.5-2B
    revision: diffusers/base/post-trained
    pipeline: Cosmos2_5_PredictBasePipeline
    input: cosmos25
    fps: 16
    num_frames: 93
    height: 480               # 480p chosen after the smoke test: same behaviour as 720p, 3.5x faster
    width: 832                # (720p: 965 s/clip on L40S; 480p: 272 s)
    vae_tiling: true
    cpu_offload: true         # needed: with .to("cuda") diffusers 0.41 + cosmos_guardrail raises '_execution_device' missing
    steps: 36
    guidance: 7.0
    cond_frames: 5
    blocks: [transformer_blocks]
    patch: [1, 2, 2]
    vae_stride: [4, 8, 8]
    cfg: separate             # cond pass first, then uncond pass
  ltx2b:
    repo: Lightricks/LTX-Video-0.9.5
    pipeline: LTXConditionPipeline
    input: ltx_conditions
    fps: 24
    num_frames: 121
    height: 480
    width: 832               # 832x480 keeps the 16:9 render aspect (704 squashed it 15%)
    steps: 50
    guidance: 3.0
    cond_frames: 25           # 8k+1 frames; 1.04 s at 24 fps
    blocks: [transformer_blocks]
    patch: [1, 1, 1]
    vae_stride: [8, 32, 32]
    cfg: batched              # batch = [uncond, cond]
    cond_batch_index: 1
  vace13:
    repo: Wan-AI/Wan2.1-VACE-1.3B-diffusers
    pipeline: WanVACEPipeline
    input: vace_mask
    fps: 16
    num_frames: 81
    height: 480
    width: 832
    steps: 50
    guidance: 5.0
    cond_frames: 17           # 1.06 s at 16 fps; known/masked boundary on a latent frame
    blocks: [blocks, vace_blocks]   # probes use `blocks`; `vace_blocks` kept for later
    patch: [1, 2, 2]
    vae_stride: [4, 8, 8]
    cfg: separate
  vace14:                     # scale pair of vace13 (screen tier C, A100-80GB)
    repo: Wan-AI/Wan2.1-VACE-14B-diffusers
    pipeline: WanVACEPipeline
    input: vace_mask
    cpu_offload: true
    fps: 16
    num_frames: 81
    height: 480
    width: 832
    steps: 50
    guidance: 5.0
    cond_frames: 17
    blocks: [blocks, vace_blocks]
    patch: [1, 2, 2]
    vae_stride: [4, 8, 8]
    cfg: separate
  wan22_5b:                   # C1-inv / C1-noise only (never generates in this study)
    repo: Wan-AI/Wan2.2-TI2V-5B-Diffusers
    vae_tiling: true
    cpu_offload: true
    pipeline: WanPipeline
    fps: 24
    num_frames: 121
    height: 480               # pilot budget: P7 only needs a forward pass at 480p
    width: 832
    steps: 50
    blocks: [blocks]
    patch: [1, 2, 2]
    vae_stride: [4, 16, 16]
  cosmos14b:                  # timing only (P11): one clip, same settings as cosmos2b
    repo: nvidia/Cosmos-Predict2.5-14B
    revision: diffusers/base/post-trained
    pipeline: Cosmos2_5_PredictBasePipeline
    input: cosmos25
    fps: 16
    num_frames: 93
    height: 480
    width: 832
    vae_tiling: true
    cpu_offload: true          # same diffusers issue as cosmos2b
    steps: 36
    guidance: 7.0
    cond_frames: 5
    blocks: [transformer_blocks]
    patch: [1, 2, 2]
    vae_stride: [4, 8, 8]
    cfg: separate

  # Screen candidates (scripts/run_pilot.py --plan screen); P11 also times cosmos3_nano. `input:` picks the adapter
  # in pilot/models.py INPUTS; models with `ext:` are outside diffusers and run from job files (pilot/jobs.py,
  # scripts/ext/), show-only (no activation capture). num_frames is always the whole saved clip, input included.
  cosmos3_nano:
    repo: nvidia/Cosmos3-Nano
    pipeline: Cosmos3OmniPipeline   # guardrail on (pipeline default, needs cosmos_guardrail)
    input: cosmos3_omni
    scheduler: UniPCMultistepScheduler
    flow_shift: 10.0          # model card; the Hub scheduler config ships 1.0
    cpu_offload: true
    fps: 24
    num_frames: 121           # 5.04 s
    height: 480               # native 720x1280; any multiple of 32 keeps the patch grid exact
    width: 832
    steps: 35                 # model card
    guidance: 6.0
    cond_frames: 5            # model card: video inputs at most 5 frames (2 latents, 0.21 s). 25 (1 + 4*6, 1.04 s)
                              # also runs (adapter keeps latents 0..6 clean) but is outside the documented use
    blocks: [layers]          # Cosmos3VLTextMoTDecoderLayer, output (text, gen) unbatched
    stream: 1                 # gen stream: video tokens first, F,H,W order
    patch: [1, 2, 2]
    vae_stride: [4, 16, 16]   # Wan2.2 VAE
    cfg: separate
  skyreels13:
    repo: Skywork/SkyReels-V2-DF-1.3B-540P-Diffusers
    pipeline: SkyReelsV2DiffusionForcingVideoToVideoPipeline
    input: skyreels_df
    scheduler: UniPCMultistepScheduler
    flow_shift: 8.0           # SkyReels-V2 generate_video_df.py default, also for video extension; Hub config ships 1.0
    fps: 24
    num_frames: 97            # one base_num_frames window: input + 72 new frames, 4.04 s
    height: 544               # native 540P (544x960): the model only comes at this resolution
    width: 960
    steps: 30                 # generate_video_df.py defaults
    guidance: 6.0
    cond_frames: 25           # 1.04 s, 1 + 4*6: ends on a latent frame
    blocks: [blocks]
    patch: [1, 2, 2]
    vae_stride: [4, 8, 8]
    cfg: separate
  skyreels14:                 # scale arm: same code path as skyreels13
    repo: Skywork/SkyReels-V2-DF-14B-540P-Diffusers
    pipeline: SkyReelsV2DiffusionForcingVideoToVideoPipeline
    input: skyreels_df
    scheduler: UniPCMultistepScheduler
    flow_shift: 8.0
    cpu_offload: true
    fps: 24
    num_frames: 97
    height: 544
    width: 960
    steps: 30
    guidance: 6.0
    cond_frames: 25
    blocks: [blocks]
    patch: [1, 2, 2]
    vae_stride: [4, 8, 8]
    cfg: separate
  ltx2:
    repo: Lightricks/LTX-2
    pipeline: LTX2ConditionPipeline
    input: ltx2_conditions
    ignore: ["text_encoder/diffusion_pytorch_model*", "ltx-2-*"]   # duplicate 52 GB Gemma 3 copy; root single-file
                              # checkpoints (~170 GB). bf16 needs > 50 GB host RAM with CPU offload: not on a 48 GB pod
    cpu_offload: true
    fps: 24
    num_frames: 121           # 8k+1, 5.04 s
    height: 480               # multiples of 32 (native 512x768)
    width: 832
    steps: 30                 # pipeline docstring example
    guidance: 3.0
    cond_frames: 25           # 1.04 s, 1 + 8*3: ends on a latent frame
    blocks: [transformer_blocks]   # blocks return (video, audio); video is out[0]
    patch: [1, 1, 1]
    vae_stride: [8, 32, 32]
    cfg: batched
    cond_batch_index: 1
  helios:
    repo: BestWishYsh/Helios-Base
    pipeline: HeliosPipeline
    ignore: ["transformer_init/*"]   # 57 GB initial weights, not used by the pipeline
    input: helios_v2v
    cpu_offload: true
    fps: 24                   # every example exports at 24 fps (training fps not stated)
    num_frames: 98            # input + two 33-frame chunks (65 new frames after the 4k+1 trim), 4.08 s
    height: 384               # native (pipeline and README defaults)
    width: 640
    steps: 50
    guidance: 5.0
    cond_frames: 33           # the pipeline's minimum V2V input (1.375 s); ~1 s is not possible
    blocks: [blocks]
    tokens: last              # history tokens come first, the current chunk is the last grid_frames tokens
    grid_frames: 33           # activations are from the first chunk (the one right after the input)
    obj_tokens: false         # the input sits in compressed history tokens, not in the chunk grid
    patch: [1, 2, 2]
    vae_stride: [4, 8, 8]
    cfg: separate
  magi45:
    repo: sand-ai/MAGI-1      # 4.5B-distill, scripts/ext/run_magi.py
    ext: magi
    fps: 24
    num_frames: 120           # input + 96 new frames (4 chunks of 24), 5.0 s
    height: 480               # any multiple of 16 is accepted (repo default 720x720)
    width: 832
    steps: 64                 # distill config default
    guidance: null            # distill: one pass, no CFG
    cond_frames: 24           # 1 s = one 24-frame chunk; non-causal VAE, 4 frames per latent
  selfforcing:
    repo: gdhe17/Self-Forcing # self_forcing_dmd.pt on Wan2.1-T2V-1.3B, scripts/ext/run_selfforcing.py
    ext: selfforcing
    fps: 16
    num_frames: 81            # 21 latents, the KV-cache maximum, 5.06 s
    height: 480               # fixed by the code (1560 tokens per latent frame)
    width: 832
    steps: 4                  # DMD few-step schedule
    guidance: null            # no CFG at inference
    cond_frames: 9            # 0.56 s, 3 latents = 1 block (blocks of 3 latents; 21 frames = 1.31 s is longer
                              # than the 1.125 s input renders, and 16 fps cannot be read exactly from the 24 fps full clip)

# Rendered scenes (pinhole camera facing the motion plane y = 0)
render:
  width: 854
  height: 480
  fps: 24
  duration_s: 6.0
  camera_distance_m: 5.0
  hfov_deg: 50.0
  floor_z_m: -1.0
  samples: 32

experiments:
  b1:      {scenes: kmain, text: caption}
  b2nl:    {scenes: kmain, text: b2nl, video: false}
  b5:      {scenes: kgrav, text: caption}
  bratio:  {scenes: kratio, text: caption}
  b1real:  {scenes: real, text: caption, seeds: [0, 1]}
