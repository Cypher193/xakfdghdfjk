name: docker image

# Builds the pod image and pushes it to ghcr.io/<owner>/cvpr_vail:latest (and :<sha>) when the Dockerfile or
# requirements change. The build needs ~15 GB of disk, so the runner's preinstalled tools are removed first.
on:
  push:
    branches: [main]
    paths: [Dockerfile, requirements.txt, .github/workflows/docker.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        run: echo "IMAGE=ghcr.io/cypher193/cvpr_vail" >> "$GITHUB_ENV"   # fixed name: repo renames do not move the image
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
